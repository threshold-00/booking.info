<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Demo: Book &mdash; Example Surf School | RealDays</title>
<meta name="description" content="Example booking flow showing how booking works on RealDays." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../../styles.css?v=a0fca9d4" />
<link rel="stylesheet" href="../../../assets/booking/booking.css?v=a1f695e5" />
<link rel="icon" href="../../../assets/favicon.svg" type="image/svg+xml" />
</head>
<body>
<div role="note" class="demo-banner"><span class="mono-tag">DEMO</span><span>Demo listing. This is an example business to show how booking works. It isn't real and you can't book it.</span></div>
<div class="bk" id="bkApp">
  <header class="site-header" style="position:sticky;top:0;background:rgba(243,242,238,0.92);backdrop-filter:blur(8px);z-index:20;">
    <div class="bar" style="display:flex;align-items:baseline;justify-content:space-between;gap:24px;padding:20px 40px;border-bottom:1px solid var(--line);">
      <span style="display:flex;align-items:baseline;"><a href="../../../index.html#top" class="logo">RealDays.</a><span class="header-demo-tag">DEMO</span></span>
      <a href="../" class="navlink" style="font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;">Back to listing</a>
    </div>
  </header>

  <section style="padding:32px 40px var(--section-y);max-width:1200px;">
    <div class="bk-progress">
      <div class="bk-progress__segs"></div>
      <p class="bk-progress__label"></p>
    </div>
    <div style="display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:48px;align-items:start;">
      <div>
        <div class="bk-step" id="bkStepTime"></div>
        <div class="bk-step" id="bkStepGuests" hidden></div>
        <div class="bk-step" id="bkStepDetails" hidden></div>
        <div class="bk-step" id="bkStepPay" hidden></div>
      </div>
      <aside class="bk-summary" id="bkSummary"></aside>
    </div>
  </section>

  <div class="bk-mobile-bar" id="bkMobileBar"></div>
</div>
<script src="../../phones/configs/demo-theme.js"></script>
<script src="../config.js"></script>
<script src="../../../assets/booking/track.js?v=1a5b125d"></script>
<script src="../../../assets/booking/booking.js?v=a3bc60be"></script>
</body>
</html>
